name: Deploy ShowTime

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service should be deployed?"
        required: true
        type: choice
        options:
          - movie-service
          - gateway
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

  repository_dispatch:
    types:
      - deploy-movie-service
      - deploy-gateway

permissions:
  contents: read
  id-token: write

concurrency:
  group: showtime-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ASG_NAME: showtime-asg

jobs:
  deploy:
    name: Deploy Service to ASG
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Deployment Target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MANUAL_SERVICE: ${{ inputs.service }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SERVICE="$MANUAL_SERVICE"
            TAG="$MANUAL_TAG"

          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$EVENT_ACTION" in
              deploy-movie-service)
                SERVICE="movie-service"
                ;;
              deploy-gateway)
                SERVICE="gateway"
                ;;
              *)
                echo "Unsupported event: $EVENT_ACTION"
                exit 1
                ;;
            esac

            TAG="$DISPATCH_TAG"
          else
            echo "Unsupported trigger"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid Docker image tag: $TAG"
            exit 1
          fi

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Deployment target: $SERVICE"
          echo "Image tag: $TAG"

      - name: Check for Active Instance Refresh
        run: |
          set -euo pipefail

          ACTIVE_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress'].InstanceRefreshId" \
            --output text)

          if [ -n "$ACTIVE_REFRESH" ] && [ "$ACTIVE_REFRESH" != "None" ]; then
            echo "An Instance Refresh is already running: $ACTIVE_REFRESH"
            exit 1
          fi

          echo "No active Instance Refresh found."

      - name: Update Movie Service Image Tag
        if: steps.target.outputs.service == 'movie-service'
        run: |
          aws ssm put-parameter \
            --name "/showtime/production/MOVIE_SERVICE_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

      - name: Update Gateway Image Tag
        if: steps.target.outputs.service == 'gateway'
        run: |
          aws ssm put-parameter \
            --name "/showtime/production/GATEWAY_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

      - name: Start Auto Scaling Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 300,
              "SkipMatching": false
            }'

      - name: Deployment Summary
        run: |
          echo "Deployment initiated successfully."
          echo "Service: ${{ steps.target.outputs.service }}"
          echo "Image tag: ${{ steps.target.outputs.tag }}"
          echo "ASG: $ASG_NAME"
