
name: Deploy ShowTime

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service should be deployed?"
        required: true
        type: choice
        options:
          - movie-service
          - gateway
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

  repository_dispatch:
    types:
      - deploy-movie-service
      - deploy-gateway

permissions:
  contents: read
  id-token: write

concurrency:
  group: showtime-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ASG_NAME: showtime-asg
  ALARM_NAME: showtime-alb-unhealthy-targets
  REFRESH_TIMEOUT: 3600
  RECOVERY_TIMEOUT: 3600

jobs:
  deploy:
    name: Deploy Service to ASG
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      # --------------------------------------------------
      # 1. Authenticate GitHub Actions with AWS using OIDC
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 2. Determine deployment target
      # --------------------------------------------------
      - name: Determine Deployment Target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MANUAL_SERVICE: ${{ inputs.service }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SERVICE="$MANUAL_SERVICE"
            TAG="$MANUAL_TAG"

          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$EVENT_ACTION" in
              deploy-movie-service)
                SERVICE="movie-service"
                ;;
              deploy-gateway)
                SERVICE="gateway"
                ;;
              *)
                echo "Unsupported event: $EVENT_ACTION"
                exit 1
                ;;
            esac

            TAG="$DISPATCH_TAG"

          else
            echo "Unsupported trigger"
            exit 1
          fi

          if [ "$SERVICE" != "movie-service" ] && \
             [ "$SERVICE" != "gateway" ]; then
            echo "Invalid service: $SERVICE"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid Docker image tag: $TAG"
            exit 1
          fi

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Service: $SERVICE"
          echo "Image tag: $TAG"

      # --------------------------------------------------
      # 3. Prevent overlapping Instance Refresh operations
      # --------------------------------------------------
      - name: Check for Active Instance Refresh
        run: |
          set -euo pipefail

          ACTIVE_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress' || Status=='Cancelling' || Status=='RollbackInProgress'].InstanceRefreshId" \
            --output text)

          if [ -n "$ACTIVE_REFRESH" ] && \
             [ "$ACTIVE_REFRESH" != "None" ]; then
            echo "An Instance Refresh is already active:"
            echo "$ACTIVE_REFRESH"
            exit 1
          fi

          echo "No active Instance Refresh found."

      # --------------------------------------------------
      # 4. Capture previous image tag
      # --------------------------------------------------
      - name: Capture Previous Image Tag
        id: previous
        run: |
          set -euo pipefail

          if [ "${{ steps.target.outputs.service }}" = "movie-service" ]; then
            PARAMETER_NAME="/showtime/production/MOVIE_SERVICE_TAG"
          else
            PARAMETER_NAME="/showtime/production/GATEWAY_TAG"
          fi

          PREVIOUS_TAG=$(aws ssm get-parameter \
            --name "$PARAMETER_NAME" \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$PREVIOUS_TAG" ] || \
             [ "$PREVIOUS_TAG" = "None" ]; then
            echo "Could not capture previous image tag."
            exit 1
          fi

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "parameter_name=$PARAMETER_NAME" >> "$GITHUB_OUTPUT"

          echo "Previous deployed image tag: $PREVIOUS_TAG"

      # --------------------------------------------------
      # 5. Update Movie Service image tag
      # --------------------------------------------------
      - name: Update Movie Service Image Tag
        if: steps.target.outputs.service == 'movie-service'
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "/showtime/production/MOVIE_SERVICE_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

          echo "Movie Service image tag updated."

      # --------------------------------------------------
      # 6. Update Gateway image tag
      # --------------------------------------------------
      - name: Update Gateway Image Tag
        if: steps.target.outputs.service == 'gateway'
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "/showtime/production/GATEWAY_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

          echo "Gateway image tag updated."

      # --------------------------------------------------
      # 7. Start primary production Instance Refresh
      # --------------------------------------------------
      - name: Start Auto Scaling Instance Refresh
        id: refresh
        run: |
          set -euo pipefail

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 300,
              "SkipMatching": false,
              "AutoRollback": true,
              "AlarmSpecification": {
                "Alarms": [
                  "'"$ALARM_NAME"'"
                ]
              }
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

          echo "Primary Instance Refresh started."
          echo "Refresh ID: $REFRESH_ID"

      # --------------------------------------------------
      # 8. Monitor primary deployment
      # --------------------------------------------------
      - name: Wait for Instance Refresh Completion
        id: wait_deployment
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          TIMEOUT="$REFRESH_TIMEOUT"
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Primary refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ] || \
               [ "$STATUS" = "RollbackSuccessful" ]; then

              echo "Primary refresh ended with status: $STATUS"
              exit 1
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))

          done

          echo "Primary refresh timed out."
          exit 1

      # --------------------------------------------------
      # 9. Safely stop or wait for primary refresh
      # --------------------------------------------------
      - name: Stop or Wait for Primary Refresh
        id: stop_primary
        if: failure() && steps.refresh.outputs.refresh_id != ''
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          TIMEOUT=900
          ELAPSED=0
          CANCEL_REQUESTED=false

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Primary refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ] || \
               [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackSuccessful" ] || \
               [ "$STATUS" = "RollbackFailed" ]; then

              echo "Primary refresh reached terminal status: $STATUS"
              exit 0
            fi

            if [ "$STATUS" = "Pending" ] || \
               [ "$STATUS" = "InProgress" ]; then

              if [ "$CANCEL_REQUESTED" = false ]; then

                echo "Requesting primary refresh cancellation..."

                aws autoscaling cancel-instance-refresh \
                  --auto-scaling-group-name "$ASG_NAME"

                CANCEL_REQUESTED=true
              fi
            fi

            if [ "$STATUS" = "RollbackInProgress" ] || \
               [ "$STATUS" = "Cancelling" ]; then

              echo "AWS is processing cancellation/rollback."
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))

          done

          echo "Primary refresh did not reach a terminal state."
          exit 1

      # --------------------------------------------------
      # 10. Restore previous image tag after failure
      # --------------------------------------------------
      - name: Restore Previous Image Tag on Failure
        id: restore
        if: failure() && (steps.refresh.outputs.refresh_id == '' || steps.stop_primary.outcome == 'success')
        run: |
          set -euo pipefail

          PREVIOUS_TAG="${{ steps.previous.outputs.previous_tag }}"
          PARAMETER_NAME="${{ steps.previous.outputs.parameter_name }}"

          if [ -z "$PREVIOUS_TAG" ] || \
             [ -z "$PARAMETER_NAME" ]; then

            echo "Previous image tag is unavailable."
            echo "Automatic rollback cannot continue."
            exit 1
          fi

          echo "Restoring previous image tag: $PREVIOUS_TAG"

          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --type "String" \
            --value "$PREVIOUS_TAG" \
            --overwrite

          echo "restored=true" >> "$GITHUB_OUTPUT"

          echo "Previous image tag restored successfully."

      # --------------------------------------------------
      # 11. Start recovery Instance Refresh
      # --------------------------------------------------
      - name: Start Recovery Instance Refresh
        id: recovery
        if: failure() && steps.refresh.outputs.refresh_id != '' && steps.restore.outputs.restored == 'true' && steps.stop_primary.outcome == 'success'
        run: |
          set -euo pipefail

          echo "Starting recovery deployment using previous image."

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 300,
              "SkipMatching": false
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

          echo "Recovery Instance Refresh started."
          echo "Recovery ID: $REFRESH_ID"

      # --------------------------------------------------
      # 12. Monitor recovery Instance Refresh
      # --------------------------------------------------
      - name: Wait for Recovery Instance Refresh
        id: wait_recovery
        if: failure() && steps.recovery.outputs.refresh_id != ''
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.recovery.outputs.refresh_id }}"
          TIMEOUT="$RECOVERY_TIMEOUT"
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Recovery refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Recovery completed successfully."
              echo "Previous image version restored."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ] || \
               [ "$STATUS" = "RollbackSuccessful" ]; then

              echo "Recovery ended with status: $STATUS"
              exit 1
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))

          done

          echo "Recovery refresh timed out."
          exit 1

      # --------------------------------------------------
      # 13. Final deployment summary
      # --------------------------------------------------
      - name: Deployment Summary
        if: always()
        run: |
          echo "========================================"
          echo "ShowTime Deployment Summary"
          echo "========================================"
          echo "Service: ${{ steps.target.outputs.service }}"
          echo "Requested image tag: ${{ steps.target.outputs.tag }}"
          echo "Previous image tag: ${{ steps.previous.outputs.previous_tag }}"
          echo "Primary refresh ID: ${{ steps.refresh.outputs.refresh_id }}"
          echo "Recovery refresh ID: ${{ steps.recovery.outputs.refresh_id }}"
          echo "ASG: $ASG_NAME"
          echo "Job status: ${{ job.status }}"
          echo "========================================"
