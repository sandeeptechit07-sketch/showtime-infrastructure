name: Deploy ShowTime

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service should be deployed?"
        required: true
        type: choice
        options:
          - movie-service
          - gateway
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

  repository_dispatch:
    types:
      - deploy-movie-service
      - deploy-gateway

permissions:
  contents: read
  id-token: write

concurrency:
  group: showtime-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ASG_NAME: showtime-asg

jobs:
  deploy:
    name: Deploy Service to ASG
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Authenticate GitHub Actions with AWS using OIDC
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 2. Determine service and Docker image tag
      # --------------------------------------------------
      - name: Determine Deployment Target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MANUAL_SERVICE: ${{ inputs.service }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SERVICE="$MANUAL_SERVICE"
            TAG="$MANUAL_TAG"

          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$EVENT_ACTION" in
              deploy-movie-service)
                SERVICE="movie-service"
                ;;
              deploy-gateway)
                SERVICE="gateway"
                ;;
              *)
                echo "Unsupported event: $EVENT_ACTION"
                exit 1
                ;;
            esac

            TAG="$DISPATCH_TAG"
          else
            echo "Unsupported trigger"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid Docker image tag: $TAG"
            exit 1
          fi

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Deployment target: $SERVICE"
          echo "Image tag: $TAG"

      # --------------------------------------------------
      # 3. Prevent overlapping ASG refreshes
      # --------------------------------------------------
      - name: Check for Active Instance Refresh
        run: |
          set -euo pipefail

          ACTIVE_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress' || Status=='Cancelling' || Status=='RollbackInProgress'].InstanceRefreshId" \
            --output text)

          if [ -n "$ACTIVE_REFRESH" ] && [ "$ACTIVE_REFRESH" != "None" ]; then
            echo "An Instance Refresh is already running: $ACTIVE_REFRESH"
            exit 1
          fi

          echo "No active Instance Refresh found."

      # --------------------------------------------------
      # 4. Capture currently deployed image SHA
      # --------------------------------------------------
      - name: Capture Previous Image Tag
        id: previous
        run: |
          set -euo pipefail

          if [ "${{ steps.target.outputs.service }}" = "movie-service" ]; then
            PARAMETER_NAME="/showtime/production/MOVIE_SERVICE_TAG"
          else
            PARAMETER_NAME="/showtime/production/GATEWAY_TAG"
          fi

          PREVIOUS_TAG=$(aws ssm get-parameter \
            --name "$PARAMETER_NAME" \
            --query "Parameter.Value" \
            --output text)

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "parameter_name=$PARAMETER_NAME" >> "$GITHUB_OUTPUT"

          echo "Previous deployed image tag: $PREVIOUS_TAG"

      # --------------------------------------------------
      # 5. Update Movie Service image SHA
      # --------------------------------------------------
      - name: Update Movie Service Image Tag
        if: steps.target.outputs.service == 'movie-service'
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "/showtime/production/MOVIE_SERVICE_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

      # --------------------------------------------------
      # 6. Update Gateway image SHA
      # --------------------------------------------------
      - name: Update Gateway Image Tag
        if: steps.target.outputs.service == 'gateway'
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "/showtime/production/GATEWAY_TAG" \
            --type "String" \
            --value "${{ steps.target.outputs.tag }}" \
            --overwrite

      # --------------------------------------------------
      # 7. Start production Instance Refresh
      # --------------------------------------------------
      - name: Start Auto Scaling Instance Refresh
        id: refresh
        run: |
          set -euo pipefail

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 300,
              "SkipMatching": false,
              "AutoRollback": true,
              "AlarmSpecification": {
                "Alarms": [
                  "showtime-alb-unhealthy-targets"
                ]
              }
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "Started Instance Refresh: $REFRESH_ID"

      # --------------------------------------------------
      # 8. Monitor production deployment
      # --------------------------------------------------
      - name: Wait for Instance Refresh Completion
        id: wait_deployment
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          TIMEOUT=3600
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Instance Refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ] || \
               [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "Deployment status: $STATUS"
              exit 1
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          echo "Timed out waiting for Instance Refresh"
          exit 1

      # --------------------------------------------------
      # 9. Restore previous image SHA on failure
      # --------------------------------------------------
      - name: Restore Previous Image Tag on Failure
        id: restore
        if: failure()
        run: |
          set -euo pipefail

          PREVIOUS_TAG="${{ steps.previous.outputs.previous_tag }}"
          PARAMETER_NAME="${{ steps.previous.outputs.parameter_name }}"

          if [ -z "$PREVIOUS_TAG" ] || [ -z "$PARAMETER_NAME" ]; then
            echo "Previous image tag unavailable. Cannot perform rollback."
            exit 1
          fi

          echo "Restoring previous image tag: $PREVIOUS_TAG"

          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --type "String" \
            --value "$PREVIOUS_TAG" \
            --overwrite

          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Previous image tag restored successfully."

      # --------------------------------------------------
      # 10. Start recovery Instance Refresh
      # --------------------------------------------------
      - name: Start Recovery Instance Refresh
        if: failure() && steps.restore.outputs.restored == 'true'
        id: recovery
        run: |
          set -euo pipefail

          echo "Starting recovery deployment with previous image."

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 300,
              "SkipMatching": false
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "Recovery refresh started: $REFRESH_ID"

      # --------------------------------------------------
      # 11. Monitor recovery deployment
      # --------------------------------------------------
      - name: Wait for Recovery Instance Refresh
        if: failure() && steps.recovery.outputs.refresh_id != ''
        run: |
          set -euo pipefail

          REFRESH_ID="${{ steps.recovery.outputs.refresh_id }}"
          TIMEOUT=3600
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Recovery status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Recovery completed. Previous version restored."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ] || \
               [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "Recovery refresh failed: $STATUS"
              exit 1
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          echo "Recovery timed out."
          exit 1

      # --------------------------------------------------
      # 12. Deployment summary
      # --------------------------------------------------
      - name: Deployment Summary
        if: always()
        run: |
          echo "Deployment workflow finished."
          echo "Service: ${{ steps.target.outputs.service }}"
          echo "New image tag: ${{ steps.target.outputs.tag }}"
          echo "Previous image tag: ${{ steps.previous.outputs.previous_tag }}"
          echo "ASG: $ASG_NAME"
          echo "Deployment job status: ${{ job.status }}"
