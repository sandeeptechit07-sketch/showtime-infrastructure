name: Deploy ShowTime

on:
  workflow_dispatch:
    inputs:
      movie_service_tag:
        description: "Movie Service Docker tag"
        required: true
      gateway_tag:
        description: "Gateway Docker tag"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd ~/showtime-infrastructure

            cat > .env <<EOF
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MOVIE_SERVICE_TAG=${{ inputs.movie_service_tag }}
            GATEWAY_TAG=${{ inputs.gateway_tag }}
            EOF

            chmod 600 .env

            echo "Deployment configuration:"
            grep -E '^(MOVIE_SERVICE_TAG|GATEWAY_TAG)=' .env

            docker compose pull
            docker compose up -d --force-recreate
            docker compose ps