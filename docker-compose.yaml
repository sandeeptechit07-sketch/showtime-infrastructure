services:

  movie-service:
    image: sandeep07k/movie-service:1.0.0
    container_name: movie-service
    environment:
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "8082:8082"
    networks:
      - showtime-network

  showtime-gateway:
    image: sandeep07k/showtime-gateway:1.0.0
    container_name: showtime-gateway
    ports:
      - "8080:8080"
    depends_on:
      - movie-service
    networks:
      - showtime-network

networks:
  showtime-network:
    driver: bridge