services:

  movie-service:
    image: sandeep07k/movie-service:${MOVIE_SERVICE_TAG}
    container_name: movie-service

    environment:
      MONGODB_URI: ${MONGODB_URI}

    ports:
      - "8082:8082"

    networks:
      - showtime-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /showtime/movie-service
        awslogs-stream: movie-service
        awslogs-create-group: "true"


  showtime-gateway:
    image: sandeep07k/showtime-gateway:${GATEWAY_TAG}
    container_name: showtime-gateway

    ports:
      - "8080:8080"

    depends_on:
      - movie-service

    networks:
      - showtime-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /showtime/gateway
        awslogs-stream: showtime-gateway
        awslogs-create-group: "true"


networks:
  showtime-network:
    driver: bridge